<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nebbia</title>
<style>
@font-face{font-family:"Geist";src:url("fonts/Geist.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url("fonts/GeistMono.woff2") format("woff2");font-weight:100 900}
/* Layout: header with tabs → wide display (stereo field | impulse response) → three modules: reverb, delay, output. Scaled to fit the plugin window. */
:root{
  --page:#dcdfd9; --body:#eef0eb; --panel:#e5e8e1; --well:#d8dbd3; --chip:#f8f9f5; --edge:#cdd1c8;
  --ink:#262826; --ink-2:#646962; --ink-3:#979c94;
  --rev:#7457f0; --dly:#0d9e7d; --accent:#ff6a3d;
  --knob-face:#f6f7f2; --knob-hi:#ffffff; --knob-shade:#cfd3ca; --knurl:rgba(0,0,0,.13); --knob-dot:#1e201e;
  --track:#cfd3ca; --shadow:rgba(40,48,36,.28); --hl:rgba(255,255,255,.9);
  --screen-edge:#c4c8bf;
  --sans:"Geist", "Helvetica Neue", system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0e0f10; --body:#18191b; --panel:#1f2023; --well:#141517; --chip:#2c2e32; --edge:#2c2e32;
  --ink:#ebede8; --ink-2:#a3a7a0; --ink-3:#686c66;
  --rev:#9a85ff; --dly:#4fe3bd; --accent:#ff7a4d;
  --knob-face:#2b2d30; --knob-hi:#3a3c40; --knob-shade:#131416; --knurl:rgba(255,255,255,.07); --knob-dot:#ebede8;
  --track:#303236; --shadow:rgba(0,0,0,.6); --hl:rgba(255,255,255,.06);
  --screen-edge:#000;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0e0f10; --body:#18191b; --panel:#1f2023; --well:#141517; --chip:#2c2e32; --edge:#2c2e32;
  --ink:#ebede8; --ink-2:#a3a7a0; --ink-3:#686c66;
  --rev:#9a85ff; --dly:#4fe3bd; --accent:#ff7a4d;
  --knob-face:#2b2d30; --knob-hi:#3a3c40; --knob-shade:#131416; --knurl:rgba(255,255,255,.07); --knob-dot:#ebede8;
  --track:#303236; --shadow:rgba(0,0,0,.6); --hl:rgba(255,255,255,.06);
  --screen-edge:#000;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--body);color:var(--ink);font-family:var(--sans);font-size:14px;transition:background .3s;-webkit-user-select:none;user-select:none;cursor:default}
.stage{position:fixed;inset:0;overflow:hidden}
.device{position:absolute;left:0;top:0;width:1320px;transform-origin:0 0;padding:22px 32px 32px;background:var(--body);transition:background .3s}

/* header */
.bar{display:flex;align-items:center;gap:28px;height:52px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{color:var(--accent)}
.brand b{font:500 21px var(--sans);letter-spacing:-.02em}
.brand small{font:400 10.5px var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.tabs{display:flex;gap:4px;margin-left:24px;height:100%;align-items:stretch}
.tab{background:none;border:0;cursor:pointer;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:0 16px;position:relative}
.tab::after{content:"";position:absolute;left:16px;right:16px;bottom:6px;height:2px;border-radius:2px;background:var(--accent);transform:scaleX(0);transition:transform .2s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab .badge{font-size:9px;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--edge);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:2px}
.right{margin-left:auto;display:flex;align-items:center;gap:12px}
.preset{display:flex;align-items:center;background:var(--well);border-radius:10px;height:36px;padding:0 4px}
.preset button{background:none;border:0;color:var(--ink-2);font:400 16px var(--sans);width:30px;height:30px;border-radius:7px;cursor:pointer}
.preset button:hover{background:var(--chip);color:var(--ink)}
.preset span{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;min-width:190px;text-align:center;font-variant-numeric:tabular-nums}
.preset em{font-style:normal;color:var(--accent)}
.chip{font:500 11px var(--mono);letter-spacing:.1em;color:var(--ink-2);background:var(--well);border-radius:10px;height:36px;display:flex;align-items:center;padding:0 14px;text-transform:uppercase}
.theme{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:10px;border:1px solid var(--edge);background:var(--chip);color:var(--ink);cursor:pointer;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.theme svg{width:18px;height:18px}
button:focus{outline:none}
:is(button,.knob):focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}

/* display */
.screen{position:relative;height:380px;border-radius:18px;overflow:hidden;background:#030303;box-shadow:0 0 0 1px var(--screen-edge),0 0 0 5px var(--well),inset 0 0 0 1px rgba(255,255,255,.05)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sbtn{position:absolute;top:12px;display:flex;gap:6px;right:14px}
.sbtn button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.75);cursor:pointer;display:grid;place-items:center}
.sbtn button:hover{background:rgba(255,255,255,.1)}

/* modules */
.mods{display:grid;grid-template-columns:1fr 1fr 290px;gap:16px;margin-top:22px}
.mod{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px 22px 22px;display:flex;flex-direction:column;gap:18px;transition:background .3s}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;height:28px}
.mtitle{display:flex;align-items:center;gap:9px;font:600 12px var(--sans);letter-spacing:.22em;text-transform:uppercase}
.mtitle i{width:8px;height:8px;border-radius:50%;background:var(--arc);box-shadow:0 0 10px var(--arc);transition:background .2s,box-shadow .2s,opacity .2s}
.pwr{width:22px;height:22px;margin:-7px -7px -7px -7px;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer}
.pwr:hover{background:var(--well)}
.mod.off .pwr i{background:var(--ink-3);box-shadow:none;opacity:.7}
.mod.off .mtitle{color:var(--ink-3)}
.mod :is(.mbody,.mhead .seg){transition:opacity .25s}
.mod.off :is(.mbody,.mhead .seg){opacity:.38}
.m-rev{--arc:var(--rev)} .m-dly{--arc:var(--dly)} .m-out{--arc:var(--accent)}
.mbody{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;flex:1}
.bigcol{display:grid;justify-items:center;gap:16px;padding:12px 6px 0}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:20px 8px;justify-items:center}
.quad.tri{grid-template-columns:1fr 1fr auto;gap:20px 4px}

/* vertical faders (module mix / gain): top = 100%, bottom = 0% */
.faders{grid-column:3;grid-row:1/span 2;align-self:stretch;display:flex;gap:2px;padding-left:6px;margin-left:0;border-left:1px solid var(--edge)}
.fw{display:grid;grid-template-rows:1fr auto;justify-items:center;gap:12px;width:34px}
.fd{position:relative;width:34px;height:100%;min-height:150px;cursor:ns-resize;touch-action:none;border-radius:8px;--v:1}
.fd .ftrk{position:absolute;left:50%;top:9px;bottom:9px;width:4px;margin-left:-2px;border-radius:2px;background:var(--track)}
.fd .ffill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v) * 100%);border-radius:2px;background:var(--arc);box-shadow:0 0 8px color-mix(in srgb,var(--arc) 45%,transparent);transition:background .3s}
.fd .tk{position:absolute;left:3px;right:3px;height:1px;top:calc(9px + (1 - var(--p)) * (100% - 18px));background:linear-gradient(90deg,var(--ink-3) 0 7px,transparent 7px calc(100% - 7px),var(--ink-3) calc(100% - 7px));opacity:.45}
.fd .thumb{position:absolute;left:50%;width:28px;height:16px;margin-left:-14px;top:calc(1px + (1 - var(--v)) * (100% - 18px));border-radius:5px;
  background:linear-gradient(var(--knob-hi),var(--knob-face) 60%,var(--knob-shade));box-shadow:0 4px 8px -3px var(--shadow),0 1px 2px var(--shadow),inset 0 1px 0 var(--hl)}
.fd .thumb::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:var(--arc)}
.fd:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.fw .kn{letter-spacing:.1em}
.fw .kv{font-size:12px}

/* segmented */
.seg{display:inline-flex;background:var(--well);border-radius:9px;padding:3px;gap:2px}
.seg button{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:5px 9px;border-radius:6px;background:none;border:0;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink-2)}
.seg button.on{background:var(--chip);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.led{display:inline-flex;align-items:center;gap:8px;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);background:var(--well);border:0;border-radius:9px;padding:7px 12px;cursor:pointer}
.led::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.5}
.led[aria-pressed="true"]{color:var(--ink)}
.led[aria-pressed="true"]::before{background:var(--arc);opacity:1;box-shadow:0 0 8px var(--arc)}

/* knobs */
.kw{display:grid;justify-items:center;gap:12px;width:max-content}
.kf{position:relative;width:var(--d);height:var(--d)}
.kf svg{position:absolute;pointer-events:none;overflow:visible}
.kf .trk{stroke:var(--track)} .kf .val{stroke:var(--arc,var(--ink));transition:stroke .3s}
.knob{position:absolute;inset:0;border-radius:50%;cursor:ns-resize;touch-action:none;
  background:radial-gradient(circle at 50% 30%,var(--knob-hi),var(--knob-face) 50%,var(--knob-shade) 100%);
  box-shadow:0 calc(var(--d)*.12) calc(var(--d)*.2) calc(var(--d)*-.06) var(--shadow),0 1px 2px var(--shadow),inset 0 1px 0 var(--hl)}
.knob::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(var(--knurl) 0deg 1.6deg,transparent 1.6deg 5deg);
  -webkit-mask:radial-gradient(circle,transparent 74%,#000 76%);mask:radial-gradient(circle,transparent 74%,#000 76%)}
.knob::after{content:"";position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 45% 35%,var(--knob-hi),var(--knob-face) 70%);box-shadow:0 1px 3px var(--shadow),inset 0 1px 0 var(--hl)}
.cap{position:absolute;inset:15%;border-radius:50%;transform:rotate(var(--a,0deg));z-index:1}
.cap i{position:absolute;left:50%;top:9%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--knob-dot)}
.big .cap i{width:3px;height:18%;margin-left:-1.5px;border-radius:2px;background:var(--arc,var(--knob-dot))}
.kl{display:grid;justify-items:center;gap:4px;white-space:nowrap}
.kn{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.kv{font:400 13px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.big .kn{font-size:11px}.big .kv{font-size:16px}
.mini .kn{font-size:9px;letter-spacing:.08em}.mini .kv{font-size:11px}

/* output */
.outtop{display:flex;align-items:center;justify-content:space-around;padding-top:6px}
.minis{display:flex;justify-content:space-between;padding-inline:2px}
.meters{display:grid;gap:7px}
.meters div{display:grid;grid-template-columns:12px 1fr;align-items:center;gap:8px;font:500 9px var(--mono);color:var(--ink-3)}
.meters span{height:4px;border-radius:2px;background:var(--well);position:relative;overflow:hidden}
.meters span::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--l,0%);border-radius:2px;background:linear-gradient(90deg,var(--dly),var(--rev) 70%,var(--accent))}

/* fx tab */
.fx{min-height:796px;display:grid;grid-template-rows:auto 1fr;gap:20px}
.fxhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--edge);padding-bottom:16px}
.fxhead h2{margin:0;font:500 26px var(--sans);letter-spacing:-.02em}
.fxhead p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.chain{font:500 11px var(--mono);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
/* fx slots */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.slot{position:relative;min-width:0;border-radius:18px;background:var(--panel);border:1px solid var(--edge);padding:16px 16px 18px;display:flex;flex-direction:column;transition:background .3s}
.slot[data-target="rev"]{--arc:var(--rev)} .slot[data-target="dly"]{--arc:var(--dly)} .slot[data-target="wet"]{--arc:var(--accent)}
.slot[data-type="empty"]{background:none;border:1.5px dashed var(--edge);padding:0}
.slot[data-type="empty"] .sbody,.slot:not([data-type="empty"]) .sadd{display:none}
.sadd{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;background:none;border:0;border-radius:18px;cursor:pointer;color:var(--ink-3);font-family:var(--sans)}
.sadd .plus{width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;font-size:22px;font-weight:300;transition:transform .2s,border-color .2s,color .2s}
.sadd:hover .plus{transform:scale(1.08);border-color:var(--ink-3);color:var(--ink)}
.sadd b{font:500 11px var(--mono);letter-spacing:.14em;color:var(--ink-2)}
.sadd small{font:400 11px var(--mono);letter-spacing:.08em}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.shd{display:flex;align-items:center;gap:10px;height:28px}
.sno{font:500 10px var(--mono);letter-spacing:.12em;color:var(--ink-3)}
.sname{display:flex;align-items:center;gap:7px;background:none;border:0;padding:5px 7px;margin-left:-5px;border-radius:7px;cursor:pointer;color:var(--ink);font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase}
.sname:hover,.sx:hover{background:var(--well)}
.sname svg{opacity:.5}
.sx{margin-left:auto;width:26px;height:26px;border-radius:7px;border:0;background:none;color:var(--ink-3);cursor:pointer;font:300 18px var(--sans);line-height:1}
.sx:hover{color:var(--ink)}
.tseg{align-self:flex-start}
.tseg button.on{color:var(--arc)}
.fxscr{position:relative;flex:1;min-height:170px;border-radius:14px;overflow:hidden;background:#030303;box-shadow:0 0 0 1px var(--screen-edge),0 0 0 4px var(--well),inset 0 0 0 1px rgba(255,255,255,.05)}
.fxscr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fxk{display:grid;grid-template-columns:1fr 1fr;gap:16px 6px;justify-items:center;align-items:center;margin-top:4px}
.rsync{display:none}
.slot[data-type="reverse"] .kw[data-k$="D"]{display:none}
.slot[data-type="reverse"] .rsync{display:inline-flex}
.slot :is(.fxscr,.fxk,.tseg){transition:opacity .25s}
.slot.off :is(.fxscr,.fxk,.tseg){opacity:.38}
.slot.off .pwr i{background:var(--ink-3);box-shadow:none;opacity:.7}
.slot.off .sname{color:var(--ink-3)}
.picker{position:absolute;inset:-1px;z-index:5;border-radius:18px;background:var(--panel);border:1px solid var(--edge);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 40px -20px var(--shadow);animation:pk .18s ease-out}
@keyframes pk{from{opacity:0;transform:translateY(6px) scale(.98)}}
.ph{display:flex;align-items:center;justify-content:space-between;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.pick{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.pick:hover,.pick.cur{background:var(--well)}
.pick i{grid-row:1/span 2;width:40px;height:40px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--accent);box-shadow:0 1px 2px var(--shadow)}
.pick b{font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.pick small{font:400 10.5px var(--mono);letter-spacing:.06em;color:var(--ink-3)}
.fxn{font:500 9.5px var(--mono);letter-spacing:.1em;color:var(--arc);border:1px solid var(--edge);border-radius:5px;padding:2px 5px;cursor:pointer;text-transform:lowercase}
.fxn:empty{display:none}
.chain{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.ch-rev{--arc:var(--rev)} .ch-dly{--arc:var(--dly)} .ch-wet{--arc:var(--accent)}
.chain b{color:var(--arc);font-weight:500}
.chain b.x{opacity:.4;text-decoration:line-through}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* activation: covers the plug-in until a licence key is activated (only shown inside the plug-in) */
.lic{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--page) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(.6);backdrop-filter:blur(14px) saturate(.6);animation:licIn .35s ease-out}
@keyframes licIn{from{opacity:0}}
.lic-card{width:min(460px,100%);display:grid;gap:18px;padding:30px 30px 26px;border-radius:22px;background:var(--panel);border:1px solid var(--edge);box-shadow:0 40px 80px -30px var(--shadow);-webkit-user-select:text;user-select:text}
.lic-card .brand svg{color:var(--accent)}
.lic-card h2{margin:4px 0 0;font:500 24px var(--sans);letter-spacing:-.02em}
.lic-card p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.lic-in{height:52px;padding:0 16px;border-radius:12px;border:1px solid var(--edge);background:var(--well);color:var(--ink);font:500 16px var(--mono);letter-spacing:.08em;text-transform:uppercase;outline:none;transition:border-color .2s}
.lic-in::placeholder{color:var(--ink-3)}
.lic-in:focus{border-color:var(--accent)}
.lic-go{height:48px;border:0;border-radius:12px;background:var(--accent);color:#120804;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:filter .2s,opacity .2s}
.lic-go:hover{filter:brightness(1.08)}
.lic-go:disabled{opacity:.55;cursor:default}
.lic-msg{min-height:20px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.lic-msg.err{color:#ff5a4a}
.lic-msg.ok{color:var(--dly)}
.lic-foot{display:flex;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--edge);font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--ink-3)}
.lic-foot button{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer}
.maker{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.maker .vs{width:30px;height:16px;color:var(--ink);margin:-4px 0 -4px 3px}
.maker .vsn{color:var(--ink-2);letter-spacing:.14em}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- plugin bridge (absent when the page is opened in a normal browser) ---------- */
const J=window.__JUCE__&&window.__JUCE__.backend;
const send=(ev,obj)=>{try{J&&J.emitEvent(ev,obj)}catch(e){}};

let BPM=120,SR=48000;
const beat=()=>60/BPM;
const NOTES=[['1/32',.125],['1/16t',1/6],['1/16',.25],['1/8t',1/3],['1/16d',.375],['1/8',.5],['1/4t',2/3],['1/8d',.75],['1/4',1],['1/2t',4/3],['1/4d',1.5],['1/2',2],['1/2d',3],['1/1',4]];
const ALGS=['hall','plate','room','chamber','spring'];
const CH={alg:ALGS,mode:['mono','stereo','ping'],route:['rd','dr','par'],sync:['sync','free']};
const pct=v=>Math.round(v)+'%';
const hz=v=>v>=1000?(v/1000).toFixed(v>=10000?1:2)+'k':Math.round(v)+'';
const D={
  decay:{label:'decay',min:.1,max:20,def:3.4,log:1,fmt:v=>(v<10?v.toFixed(2):v.toFixed(1))+' s'},
  predelay:{label:'pre-delay',min:0,max:250,def:18,fmt:v=>Math.round(v)+' ms'},
  size:{label:'size',min:0,max:100,def:62,fmt:pct},
  damping:{label:'damping',min:0,max:100,def:38,fmt:pct},
  diffusion:{label:'diffusion',min:0,max:100,def:70,fmt:pct},
  time:{label:'time',min:10,max:2000,log:1,def:750},
  feedback:{label:'feedback',min:0,max:100,def:46,fmt:pct},
  tone:{label:'tone',min:500,max:20000,log:1,def:6000,fmt:v=>hz(v)+'Hz'},
  depth:{label:'mod depth',min:0,max:100,def:14,fmt:pct},
  rate:{label:'mod rate',min:.05,max:8,log:1,def:.6,fmt:v=>v.toFixed(v<1?2:1)+' Hz'},
  mix:{label:'mix',min:0,max:100,def:32,fmt:pct},
  output:{label:'gain',min:-24,max:12,def:0,fmt:v=>(Math.abs(v)<.05?'0.0':(v>0?'+':'−')+Math.abs(v).toFixed(1))+' dB'},
  lowcut:{label:'lo cut',min:20,max:1000,def:140,log:1,fmt:v=>hz(v)},
  highcut:{label:'hi cut',min:1000,max:20000,def:9200,log:1,fmt:v=>hz(v)},
  width:{label:'width',min:0,max:200,def:120,fmt:pct},
  duck:{label:'duck',min:0,max:100,def:0,fmt:pct},
  revMix:{label:'mix',min:0,max:100,def:100,fmt:pct},
  revGain:{label:'gain',min:0,max:100,def:100,fmt:pct},
  dlyMix:{label:'mix',min:0,max:100,def:100,fmt:pct},
  dlyGain:{label:'gain',min:0,max:100,def:100,fmt:pct},
};
const toN=(d,v)=>d.log?Math.log(v/d.min)/Math.log(d.max/d.min):(v-d.min)/(d.max-d.min);
const fromN=(d,n)=>d.log?d.min*Math.pow(d.max/d.min,n):d.min+n*(d.max-d.min);
const S={alg:'hall',route:'dr',mode:'ping',sync:'sync',freeze:false,revOn:true,dlyOn:true,playing:true,preset:2};
const N={};

/* ---------- fx slot definitions (mappings match Source/Params.h) ---------- */
const FXT=['empty','distortion','eq','chorus','phaser','reverse'];
const FXTG=['rev','dly','wet'];
const FXRGB={rev:'154,133,255',dly:'79,227,189',wet:'255,122,77'};
const PK='ABCD';
const fxNote=n=>NOTES[clamp(Math.round(n*13),0,13)];
const pctN=n=>Math.round(n*100)+'%';
const dbN=n=>{const v=(n-.5)*30;return (Math.abs(v)<.05?'0.0':(v>0?'+':'−')+Math.abs(v).toFixed(1))+' dB'};
const rateN=k=>n=>{const v=.05*Math.pow(k,n);return v.toFixed(v<1?2:1)+' Hz'};
const revSec=(n,sync)=>clamp(sync?fxNote(n)[1]*beat():.03*Math.pow(2000/30,n),.03,2);
const ICON={
  distortion:'<polyline points="2,15 6,15 8,6 16,6 18,15 22,15"/><path d="M2 11h20" opacity=".3"/>',
  eq:'<path d="M2 15c3 0 4-7 7-7s3 9 6 9 4-5 7-5"/><circle cx="9" cy="8" r="1.6" fill="currentColor"/><circle cx="15" cy="17" r="1.6" fill="currentColor"/>',
  chorus:'<path d="M2 12c2.5-5 5.5-5 8 0s5.5 5 8 0 3-3 4-2"/><path d="M2 9c2.5-5 5.5-5 8 0s5.5 5 8 0 3-3 4-2" opacity=".45"/>',
  phaser:'<path d="M2 9h3c2 0 2 8 4 8s2-8 4-8 2 8 4 8 2-8 4-8h1"/>',
  reverse:'<path d="M21 12H5"/><path d="M10 7l-5 5 5 5"/><path d="M14 5v2M17 4v4M20 6v1" opacity=".5"/>',
};
const FXDEF={
  distortion:{sub:'drive · shape · tone',p:[{l:'drive',def:.4,fmt:n=>Math.round(n*36)+' dB'},{l:'shape',def:.3,fmt:n=>n<.03?'soft':n>.97?'fold':pctN(n)},{l:'tone',def:.7,fmt:n=>hz(1000*Math.pow(18,n))+'Hz'},{l:'mix',def:1,fmt:pctN}]},
  eq:{sub:'low · mid · high',p:[{l:'low',def:.5,fmt:dbN},{l:'mid',def:.5,fmt:dbN},{l:'freq',def:.5,fmt:n=>hz(200*Math.pow(40,n))+'Hz'},{l:'high',def:.5,fmt:dbN}]},
  chorus:{sub:'rate · depth · spread',p:[{l:'rate',def:.3,fmt:rateN(160)},{l:'depth',def:.5,fmt:pctN},{l:'spread',def:.5,fmt:pctN},{l:'mix',def:.5,fmt:pctN}]},
  phaser:{sub:'rate · depth · feedback',p:[{l:'rate',def:.25,fmt:rateN(100)},{l:'depth',def:.7,fmt:pctN},{l:'feedback',def:.5,fmt:n=>pctN(n*.9)},{l:'mix',def:.5,fmt:pctN}]},
  reverse:{sub:'time · crossfade',p:[{l:'time',def:.5,fmt:(n,s)=>N[`fx${s}D`]>.5?fxNote(n)[0]:Math.round(revSec(n,false)*1000)+' ms'},{l:'xfade',def:.3,fmt:n=>pctN(n*.5)},{l:'mix',def:1,fmt:pctN},{l:'sync',def:1,fmt:n=>n>.5?'sync':'free'}]},
};
S.fx=[1,2,3,4].map(()=>({type:'empty',target:'rev',on:true}));
const fxFmt=(s,i,n)=>{const t=S.fx[s-1].type;return t==='empty'?pctN(n):FXDEF[t].p[i].fmt(n,s)};
$('#slots').innerHTML=[1,2,3,4].map(s=>`<div class="slot" data-s="${s}" data-type="empty" data-target="rev">
  <button class="sadd" data-pick="${s}"><span class="plus">+</span><b>slot 0${s}</b><small>add effect</small></button>
  <div class="sbody">
    <div class="shd"><button class="pwr" data-fxon="${s}" aria-pressed="true" title="on/off"><i></i></button><span class="sno">0${s}</span>
      <button class="sname" data-pick="${s}"><span></span><svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l3.5 3.5L8 1"/></svg></button>
      <button class="sx" data-rm="${s}" title="remove">×</button></div>
    <div class="seg tseg" data-fxt="${s}"><button data-v="rev">rev</button><button data-v="dly">dly</button><button data-v="wet">r+d</button></div>
    <div class="fxscr"><canvas></canvas></div>
    <div class="fxk">${[...PK].map(k=>`<div class="kw sm" data-k="fx${s}${k}"></div>`).join('')}<div class="seg rsync" data-rsync="${s}"><button data-v="sync">sync</button><button data-v="free">free</button></div></div>
  </div>
  <div class="picker" hidden><div class="ph">slot 0${s} · choose effect<button class="sx" data-close="${s}">×</button></div>
    ${FXT.slice(1).map(t=>`<button class="pick" data-fx="${t}" data-s="${s}"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[t]}</svg></i><b>${t}</b><small>${FXDEF[t].sub}</small></button>`).join('')}
  </div></div>`).join('');
for(let s=1;s<=4;s++)[...PK].forEach((k,i)=>{D[`fx${s}${k}`]={label:'',min:0,max:1,def:.5,fmt:n=>fxFmt(s,i,n)}});
const noteIdx=()=>Math.round(N.time*(NOTES.length-1));
const timeMs=()=>S.sync==='sync'?NOTES[noteIdx()][1]*beat()*1000:fromN(D.time,N.time);
const val=id=>id==='time'?timeMs():fromN(D[id],N[id]);
const nearestNote=ms=>{let b=0,bd=1e9;NOTES.forEach(([,x],i)=>{const d=Math.abs(Math.log(x*beat()*1000/ms));if(d<bd){bd=d;b=i}});return b};

/* the time knob drives "note" when synced and "timeMs" when free */
const HN={note:10/(NOTES.length-1),timeMs:toN(D.time,750)};
const pidOf=id=>id==='time'?(S.sync==='sync'?'note':'timeMs'):id;
function sendKnob(id){
  const pid=pidOf(id),v=id==='time'?(S.sync==='sync'?noteIdx()/(NOTES.length-1):N.time):N[id];
  if(id==='time')HN[pid]=v;
  send('param',{id:pid,value:v});
}
const gesture=(id,begin)=>send('gesture',{id:pidOf(id),begin});
const sendDiscrete=(pid,value)=>{send('gesture',{id:pid,begin:true});send('param',{id:pid,value});send('gesture',{id:pid,begin:false})};
const sendChoice=name=>{const a=CH[name];sendDiscrete(name,a.indexOf(S[name])/(a.length-1))};

/* ---------- knobs ---------- */
$$('[data-k]').forEach(el=>{
  const id=el.dataset.k,d=D[id];
  const size=el.classList.contains('big')?148:el.classList.contains('mid')?104:el.classList.contains('mini')?42:el.classList.contains('sm')?58:70;
  const pad=size>120?13:size<60?6:9, sw=size>120?3:2, S2=size+pad*2, r=S2/2-sw, C=2*Math.PI*r;
  el.style.setProperty('--d',size+'px');
  el.innerHTML=`<div class="kf"><svg style="left:${-pad}px;top:${-pad}px" width="${S2}" height="${S2}" viewBox="0 0 ${S2} ${S2}">
    <circle class="trk" cx="${S2/2}" cy="${S2/2}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*.75} ${C}" transform="rotate(135 ${S2/2} ${S2/2})"/>
    <circle class="val" cx="${S2/2}" cy="${S2/2}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="0 ${C}" transform="rotate(135 ${S2/2} ${S2/2})" data-c="${C}"/></svg>
    <div class="knob" role="slider" tabindex="0" id="k-${id}" aria-label="${d.label}" aria-valuemin="0" aria-valuemax="100"><div class="cap"><i></i></div></div></div>
    <div class="kl"><span class="kn">${d.label}</span><span class="kv" id="v-${id}"></span></div>`;
  N[id]=id==='time'?HN.note:toN(d,d.def);
  const k=el.querySelector('.knob');let sy=0,sn=0,drag=false;
  const fine=()=>id==='time'&&S.sync==='sync';
  const once=n=>{gesture(id,true);setN(id,n);gesture(id,false)};
  k.addEventListener('pointerdown',e=>{drag=true;sy=e.clientY;sn=N[id];k.setPointerCapture(e.pointerId);e.preventDefault();k.focus({preventScroll:true});gesture(id,true)});
  k.addEventListener('pointermove',e=>{if(drag)setN(id,sn+(sy-e.clientY)/(e.shiftKey?1100:240))});
  const end=()=>{if(drag){drag=false;gesture(id,false)}};
  k.addEventListener('pointerup',end);k.addEventListener('pointercancel',end);
  k.addEventListener('wheel',e=>{e.preventDefault();once(N[id]-e.deltaY*(e.shiftKey?.0002:.0009))},{passive:false});
  k.addEventListener('dblclick',()=>once(fine()?NOTES.findIndex(n=>n[0]==='1/4d')/(NOTES.length-1):toN(d,d.def)));
  k.addEventListener('keydown',e=>{const st=fine()?1/(NOTES.length-1):(e.shiftKey?.002:.01);
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){once(N[id]+st);e.preventDefault()}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){once(N[id]-st);e.preventDefault()}});
});
/* ---------- faders: drag the cap, click the track to jump, shift = fine ---------- */
const FADERS=new Set();
$$('[data-f]').forEach(el=>{
  const id=el.dataset.f,d=D[id];FADERS.add(id);
  el.innerHTML=`<div class="fd" role="slider" tabindex="0" id="k-${id}" aria-label="${d.label}" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="ftrk"><div class="ffill"></div></div>${[0,.25,.5,.75,1].map(p=>`<i class="tk" style="--p:${p}"></i>`).join('')}<div class="thumb"></div></div>
    <div class="kl"><span class="kn">${d.label}</span><span class="kv" id="v-${id}"></span></div>`;
  N[id]=toN(d,d.def);
  const f=el.querySelector('.fd'),th=f.querySelector('.thumb');let sy=0,sn=0,drag=false;
  const span=()=>Math.max(1,f.getBoundingClientRect().height*(1-18/f.offsetHeight));
  const once=n=>{gesture(id,true);setN(id,n);gesture(id,false)};
  f.addEventListener('pointerdown',e=>{
    e.preventDefault();f.setPointerCapture(e.pointerId);f.focus({preventScroll:true});drag=true;gesture(id,true);
    if(!th.contains(e.target)&&!e.shiftKey){const r=f.getBoundingClientRect(),pad=9*r.height/f.offsetHeight;setN(id,1-(e.clientY-r.top-pad)/span())}
    sy=e.clientY;sn=N[id];
  });
  f.addEventListener('pointermove',e=>{if(drag)setN(id,sn+(sy-e.clientY)/span()*(e.shiftKey?.2:1))});
  const end=()=>{if(drag){drag=false;gesture(id,false)}};
  f.addEventListener('pointerup',end);f.addEventListener('pointercancel',end);
  f.addEventListener('wheel',e=>{e.preventDefault();once(N[id]-e.deltaY*(e.shiftKey?.0002:.0009))},{passive:false});
  f.addEventListener('dblclick',()=>once(toN(d,d.def)));
  f.addEventListener('keydown',e=>{const st=e.shiftKey?.002:.01;
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){once(N[id]+st);e.preventDefault()}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){once(N[id]-st);e.preventDefault()}});
});
function renderFader(id){
  const f=$('#k-'+id),txt=D[id].fmt(val(id));
  f.style.setProperty('--v',N[id]);
  f.setAttribute('aria-valuenow',Math.round(N[id]*100));f.setAttribute('aria-valuetext',txt);
  $('#v-'+id).textContent=txt;
}
function renderKnob(id){
  if(FADERS.has(id))return renderFader(id);
  let n=N[id],txt;
  if(id==='time'){if(S.sync==='sync'){const i=noteIdx();n=i/(NOTES.length-1);txt=`${NOTES[i][0]} · ${Math.round(timeMs())}`}else txt=Math.round(timeMs())+' ms'}
  else txt=D[id].fmt(val(id));
  const k=$('#k-'+id),v=k.parentNode.querySelector('.val'),C=+v.dataset.c;
  k.querySelector('.cap').style.setProperty('--a',(-135+n*270)+'deg');
  v.setAttribute('stroke-dasharray',`${Math.max(.001,C*.75*n)} ${C}`);
  k.setAttribute('aria-valuenow',Math.round(n*100));k.setAttribute('aria-valuetext',txt);
  $('#v-'+id).textContent=txt;
}
function setN(id,n){N[id]=clamp(n,0,1);renderKnob(id);sendKnob(id);changed()}

function chainUI(){
  const nm={distortion:'dist',eq:'eq',chorus:'chorus',phaser:'phaser',reverse:'reverse'},lab={rev:'reverb',dly:'delay',wet:'r+d'};
  $('#chain').innerHTML=FXTG.map(tg=>{const l=S.fx.filter(f=>f.type!=='empty'&&f.target===tg);
    return `<span class="ch-${tg}">${lab[tg]} → ${l.length?l.map(f=>`<b${f.on?'':' class="x"'}>${nm[f.type]}</b>`).join(' · '):'—'}</span>`}).join('');
  const n=S.fx.filter(f=>f.type!=='empty').length,b=$('#fxBadge');b.textContent=n;b.hidden=!n;
  FXTG.forEach(tg=>{$(`[data-fxn="${tg}"]`).textContent=(c=>c?'fx '+c:'')(S.fx.filter(f=>f.type!=='empty'&&f.target===tg&&f.on).length)});
}
function fxUI(s){
  const f=S.fx[s-1],el=$(`.slot[data-s="${s}"]`);
  el.dataset.type=f.type;el.dataset.target=f.target;el.classList.toggle('off',!f.on);
  el.querySelector('[data-fxon]').setAttribute('aria-pressed',f.on);
  el.querySelector('.sname span').textContent=f.type;
  el.querySelectorAll('.tseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.target));
  el.querySelectorAll('.rsync button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='sync')===(N[`fx${s}D`]>.5)));
  el.querySelectorAll('.pick').forEach(b=>b.classList.toggle('cur',b.dataset.fx===f.type));
  [...PK].forEach((k,i)=>{const id=`fx${s}${k}`,p=f.type!=='empty'&&FXDEF[f.type].p[i];
    D[id].def=p?p.def:.5;D[id].label=p?p.l:'';$('#k-'+id).closest('.kw').querySelector('.kn').textContent=D[id].label;$('#k-'+id).setAttribute('aria-label',D[id].label);renderKnob(id)});
  chainUI();
}
function pickFx(s,type){
  const f=S.fx[s-1];f.type=type;f.on=true;
  sendDiscrete(`fx${s}Type`,FXT.indexOf(type)/(FXT.length-1));sendDiscrete(`fx${s}On`,1);
  if(type!=='empty')FXDEF[type].p.forEach((p,i)=>{const id=`fx${s}${PK[i]}`;N[id]=p.def;sendDiscrete(id,p.def)});
  fxUI(s);changed();
}
$('#slots').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const pk=$$('.picker');
  if(b.dataset.pick){pk.forEach(p=>p.hidden=true);$(`.slot[data-s="${b.dataset.pick}"] .picker`).hidden=false;return}
  if(b.dataset.close){pk.forEach(p=>p.hidden=true);return}
  if(b.dataset.fx){pk.forEach(p=>p.hidden=true);pickFx(+b.dataset.s,b.dataset.fx);return}
  if(b.dataset.rm){pickFx(+b.dataset.rm,'empty');return}
  if(b.dataset.fxon){const s=+b.dataset.fxon,f=S.fx[s-1];f.on=!f.on;sendDiscrete(`fx${s}On`,f.on?1:0);fxUI(s);return}
  const tg=b.closest('[data-fxt]');if(tg){const s=+tg.dataset.fxt;S.fx[s-1].target=b.dataset.v;sendDiscrete(`fx${s}Target`,FXTG.indexOf(b.dataset.v)/2);fxUI(s);return}
  const rs=b.closest('[data-rsync]');if(rs){const s=+rs.dataset.rsync,id=`fx${s}D`;N[id]=b.dataset.v==='sync'?1:0;sendDiscrete(id,N[id]);fxUI(s)}
});

const PRESETS=[
  {name:'small room',alg:'room',route:'par',mode:'mono',sync:'sync',note:'1/16',v:{decay:.8,predelay:4,size:28,damping:55,diffusion:80,feedback:18,tone:9000,depth:6,rate:.4,mix:22,output:0,lowcut:90,highcut:12000,width:90,duck:0}},

  {name:'dub hall',alg:'hall',route:'dr',mode:'ping',sync:'sync',note:'1/4d',v:{decay:3.4,predelay:18,size:62,damping:38,diffusion:70,feedback:46,tone:6000,depth:14,rate:.6,mix:32,output:0,lowcut:140,highcut:9200,width:120,duck:0}},
  {name:'cathedral',alg:'hall',route:'rd',mode:'stereo',sync:'sync',note:'1/2',v:{decay:14,predelay:62,size:96,damping:22,diffusion:90,feedback:30,tone:5200,depth:35,rate:.25,mix:55,output:-2,lowcut:220,highcut:6500,width:170,duck:30}},
  {name:'tape echo',alg:'spring',route:'dr',mode:'mono',sync:'free',ms:330,v:{decay:1.6,predelay:8,size:40,damping:60,diffusion:45,feedback:62,tone:2800,depth:40,rate:1.8,mix:38,output:0,lowcut:200,highcut:5000,width:60,duck:20}},
];
/* presets leave the per-module mix/gain at their defaults */
const MOD_DEF={revMix:100,revGain:100,dlyMix:100,dlyGain:100};
let tween=null,tweenTarget=null;
function applyPreset(i,instant){
  const p=PRESETS[i];S.preset=i;
  setSeg('alg',p.alg,1);setSeg('route',p.route,1);setSeg('mode',p.mode,1);setFreeze(false);setPower('revOn',true);setPower('dlyOn',true);
  S.sync=p.sync;segUI('sync',p.sync);
  const target={...Object.fromEntries(Object.entries({...MOD_DEF,...p.v}).map(([k,v])=>[k,toN(D[k],v)])),
    time:p.sync==='sync'?NOTES.findIndex(n=>n[0]===p.note)/(NOTES.length-1):toN(D.time,p.ms)};
  if(p.sync==='sync')HN.note=target.time;else HN.timeMs=target.time;
  tweenTarget=target;
  const from={...N},t0=performance.now(),dur=instant?0:420;
  cancelAnimationFrame(tween);
  const step=now=>{const k=dur?clamp((now-t0)/dur,0,1):1,e=1-Math.pow(1-k,3);
    for(const id in tweenTarget){N[id]=from[id]+(tweenTarget[id]-from[id])*e;renderKnob(id)}
    if(k>=1)tweenTarget=null;
    changed();if(k<1)tween=requestAnimationFrame(step)};
  step(t0);
}
const goPreset=i=>{applyPreset(i);send('preset',{index:i})};
$('#pPrev').onclick=()=>goPreset((S.preset+PRESETS.length-1)%PRESETS.length);
$('#pNext').onclick=()=>goPreset((S.preset+1)%PRESETS.length);
function isEdited(){const p=PRESETS[S.preset];return Object.entries({...MOD_DEF,...p.v}).some(([k,v])=>Math.abs(toN(D[k],v)-N[k])>.004)||S.alg!==p.alg||S.route!==p.route||S.mode!==p.mode||S.sync!==p.sync||S.freeze||!S.revOn||!S.dlyOn}

/* ---------- state coming from the plugin ---------- */
function hostKnob(id,n){if(tweenTarget&&id in tweenTarget){tweenTarget[id]=n;return}N[id]=n;renderKnob(id)}
function applyHost(p){
  let timeDirty=false;const fxDirty=new Set();
  for(const [id,v] of Object.entries(p)){
    if(CH[id]){const a=CH[id],x=a[clamp(Math.round(v*(a.length-1)),0,a.length-1)];S[id]=x;segUI(id,x);if(id==='sync')timeDirty=true}
    else if(id==='freeze')setFreeze(v>.5);
    else if(id==='revOn'||id==='dlyOn')setPower(id,v>.5);
    else if(id==='note'||id==='timeMs'){HN[id]=v;timeDirty=true}
    else if(/^fx\d(Type|Target|On)$/.test(id)){const s=+id[2],k=id.slice(3),f=S.fx[s-1];
      if(k==='Type')f.type=FXT[clamp(Math.round(v*(FXT.length-1)),0,FXT.length-1)];else if(k==='Target')f.target=FXTG[clamp(Math.round(v*2),0,2)];else f.on=v>.5;fxDirty.add(s)}
    else if(D[id]){hostKnob(id,v);if(/^fx\d[A-D]$/.test(id))fxDirty.add(+id[2])}
  }
  if(timeDirty)hostKnob('time',S.sync==='sync'?HN.note:HN.timeMs);
  fxDirty.forEach(fxUI);
}
const lv=[0,0];
let gotState=false;
J&&J.addEventListener('state',st=>{
  gotState=true;
  if(st.bpm&&st.bpm!==BPM){BPM=st.bpm;$('#bpm').textContent=BPM.toFixed(1)+' bpm';renderKnob('time')}
  if(st.sr)SR=st.sr;
  if(st.lic!==undefined)licState(st.lic);
  if(st.theme!==undefined){if(st.theme===1)root.dataset.theme='light';else if(st.theme===2)root.dataset.theme='dark';else delete root.dataset.theme;paintTheme()}
  if(st.preset!==undefined&&st.preset!==S.preset&&PRESETS[st.preset])S.preset=st.preset;
  if(st.params)applyHost(st.params);
  if(st.vis)ingestVis(st.vis);
  if(st.fxl)st.fxl.forEach((v,i)=>{const db=20*Math.log10(Math.max(v,1e-5));FXLV[i]=Math.max(clamp((db+48)/48,0,1),FXLV[i]*.88)});
  if(st.meters)st.meters.forEach((v,c)=>{const db=20*Math.log10(Math.max(v,1e-5));lv[c]=Math.max(clamp((db+54)/54,0,1),lv[c]*.86)});
  changed();
});

/* ---------- model ---------- */
function P(){return{pre:val('predelay')/1000,size:val('size')/100,decay:val('decay'),damp:val('damping')/100,diff:val('diffusion')/100,
  fb:val('feedback')/100,dt:timeMs()/1000,depth:val('depth')/100,rate:val('rate'),tone:N.tone,mix:val('mix')/100,width:val('width')/100,alg:S.alg,freeze:S.freeze,revOn:S.revOn,dlyOn:S.dlyOn,
  revAmt:val('revMix')/100*Math.pow(val('revGain')/100,2),dlyAmt:val('dlyMix')/100*Math.pow(val('dlyGain')/100,2)}}
const ALG={hall:{att:1,dec:1},plate:{att:.25,dec:1.15},room:{att:.4,dec:2.4},chamber:{att:.7,dec:1.5},spring:{att:.15,dec:1.3,wob:1}};
function parts(t,p){
  const a=ALG[p.alg];const dry=t>=0?Math.exp(-t/.008):0;let rev=0,del=0;const tp=t-p.pre;
  if(tp>0){rev=(1-Math.exp(-tp/((.012+p.size*.09)*a.att)))*(p.freeze?1:Math.exp(-6.9*tp*a.dec/p.decay))*(.32+.42*p.size)*(a.wob?(.75+.25*Math.cos(tp*90)):1)}

  const w=.25+p.mix;return{dry:dry*(1-p.mix*.6),rev:rev*w,del:del*w};
}
const pan=(k,p)=>S.mode==='ping'?(k%2?-1:1)*Math.min(1,p.width):S.mode==='stereo'?(JIT[k][0]*1.4)*Math.min(1,p.width):0;

/* ---------- display ---------- */
const screen=$('#screen'),cv=$('#cv');let ctx=cv.getContext('2d');

let seed=11;const rnd=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;

const JIT=Array.from({length:64},()=>[rnd()-.5,rnd()-.5,rnd(),rnd()]);
const grain=document.createElement('canvas');grain.width=grain.height=160;

let grainPat=null;

function blob(x,y,rx,ry,c,a){

let lastPh=0;

/* settings preview: the simulated response of the current settings (shown when there is no audio) */
function drawModel(now){
  const p=P(),tm=reduced?0:now/1000;
  const sc=Math.max(.75,Math.min(W/920,H/440)), topH=Math.round(H*.6);
  const T=clamp(Math.max(p.pre+(p.freeze?3:p.decay*.75),p.dt*4.5,1),1,8);
  if(S.playing&&!reduced)lastPh=(now/1000)%T;
  const ph=reduced?T*.35:lastPh;
  const xT=t=>t/T*W;
  const hue=HUE[p.alg];
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);

  const breathe=1+.05*Math.sin(tm*.7);

  blob(cx,cy,rad*1.15*breathe,rad*.95,hue,.42*wet*Math.min(1.5,p.revAmt)*(p.freeze?1.25:1));
  blob(cx-rad*.25,cy+rad*.1,rad*.45,rad*.5,'200,215,255',.22*wet*Math.min(1.5,p.revAmt));
  }

    const tt=p.pre+(.05+j*.18)*Math.min(p.decay,T);const x=xT(tt)+JIT[j][0]*30*sc+Math.sin(tm*.3+j)*6*p.depth*sc;

  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  /* header line */

    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(Math.round(bx)-1,Math.round(by)-1,3,3);

   for(let i=0;i<5;i++){const j=JIT[i+25];ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(Math.round(bx+j[2]*bw),Math.round(by+j[3]*bh),2,2)}

  ctx.strokeStyle='rgba(255,255,255,.05)';

  else{step=[.1,.25,.5,1,2].find(s=>T/s<=9)||2;lab=t=>t<1?Math.round(t*1000)+' ms':t.toFixed(t%1?2:1)+' s'}

  for(let t=0;t<T-1e-6;t+=step){const x=xT(t);ctx.strokeStyle='rgba(255,255,255,.1)';line(sx(x),topH,sx(x),H);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(lab(t),x+8,topH+20)}

/* ---------- live audio display ----------

   and the delay, the stereo position of each band, and peak buckets of the
   output for the scrolling waveform. With no audio the settings preview fades in. */
const NB=48,bandHz=i=>30*Math.pow(600,(i+.5)/NB),bandX=i=>W*(.04+.92*(i+.5)/NB),freqX=f=>W*(.04+.92*Math.log(f/30)/Math.log(600));

  ['dry','rev','dly'].forEach(k=>{const a=v[k];if(!a)return;const d=VIS[k];for(let i=0;i<NB;i++){const x=a[i]/1000;d[i]+=(x-d[i])*(x>d[i]?.6:.14)}});

  if(v.bs)wvSec=v.bs/1e6;

}
const vis=v=>clamp((v-.22)/.78,0,1); // hide the bottom ~17 dB of the 78 dB range
function drawLive(now){
  const p=P(),tm=reduced?0:now/1000,sc=Math.max(.75,Math.min(W/920,H/440)),topH=Math.round(H*.6),cy=topH*.54,spread=topH*.3;
  const T=clamp(Math.max(p.pre+(p.freeze?3:p.decay*.75),p.dt*4.5,2),2,8),hue=HUE[p.alg];
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);

  /* light field: x = frequency, y = stereo position, size/brightness = level */
  ctx.globalCompositeOperation='lighter';
  /* reverb fog and delay flash around where each module's energy sits */
  [['rev','pr',hue,.55,(70+p.size*210)*sc],['dly','pd','255,128,40',.4,60*sc]].forEach(([k,pk,c,amt,rad])=>{
    let sw=0,sx_=0,sy_=0;for(let i=0;i<NB;i++){const v=vis(VIS[k][i]);sw+=v;sx_+=v*bandX(i);sy_+=v*VIS[pk][i]}
    if(sw<.05)return;const m=sw/NB,x=sx_/sw,y=cy+sy_/sw*spread,br=1+.04*Math.sin(tm*.7);
    blob(x,y,rad*1.15*br,rad*.9,c,amt*Math.min(1,m*1.6));blob(x-rad*.2,y,rad*.45,rad*.5,'200,215,255',amt*.4*Math.min(1,m*1.6));
  });
  for(let i=0;i<NB;i++){
    const x=bandX(i),d=vis(VIS.dry[i]),r=vis(VIS.rev[i]),e=vis(VIS.dly[i]);
    if(d>0)blob(x,cy,(6+d*14)*sc,(10+d*50)*sc,'255,240,220',.2*d);
    if(r>0)blob(x,cy+VIS.pr[i]*spread,(18+r*36)*sc,topH*(.16+.42*r),hue,.5*r*r+.1*r);
    if(e>0){const y=cy+VIS.pd[i]*spread;blob(x,y,(12+e*24)*sc,(18+e*70)*sc,'255,128,40',.55*e*e+.1*e);if(e>.45)blob(x,y,(4+e*7)*sc,(4+e*7)*sc,'255,228,195',.85*(e-.45)/.55)}
  }

  if(!grainPat)grainPat=ctx.createPattern(grain,'repeat');
  ctx.save();ctx.globalAlpha=.07;ctx.translate((tm*997)%160,(tm*613)%160);ctx.fillStyle=grainPat;ctx.fillRect(-160,-160,W+320,H+320);ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H*.42,H*.2,W/2,H*.42,W*.7);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.setLineDash([2,6]);line(0,sx(cy),W,sx(cy));ctx.setLineDash([]);

  /* header line */
  const pr=PRESETS[S.preset],khz=(SR/1000).toFixed(SR%1000?1:0);
  ctx.font='400 14px "Geist", system-ui, sans-serif';ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText(`${String(S.preset+1).padStart(2,'0')} ${pr.name} · ${p.alg} · ${khz} kHz · ${BPM.toFixed(1)} bpm · ${S.sync==='sync'?NOTES[noteIdx()][0]:Math.round(timeMs())+' ms'}${p.freeze?' · freeze':''}`,22,32);
  ctx.font='400 11px "Geist Mono", monospace';ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillText('● live',22,52);

    ctx.strokeStyle='rgba(255,255,255,.34)';ctx.strokeRect(sx(bx),sx(by),Math.round(s),Math.round(s));
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.strokeRect(sx(bx+s*.22),sx(by+s*.22),Math.round(s*.56),Math.round(s*.56));
    ctx.fillStyle=`rgba(${t.c},.9)`;ctx.fillText(t.k,bx+4,by+s+14);
    ctx.fillStyle='rgba(255,255,255,.45)';
    ctx.fillText(`${hz(bandHz(t.i))}Hz  −${(78-t.raw*78).toFixed(1)} dB  ${t.pan<-.15?'L':t.pan>.15?'R':'C'}`,bx+30,by+s+14);

  ctx.strokeStyle='rgba(255,255,255,.05)';for(let r=1;r<4;r++)line(0,sx(topH+(H-topH)*r/4),W,sx(topH+(H-topH)*r/4));
  const step=T>4?1:.5;ctx.font='400 12px "Geist", system-ui, sans-serif';
  for(let t=step;t<T-1e-6;t+=step){const x=W-t/T*W;ctx.strokeStyle='rgba(255,255,255,.1)';line(sx(x),topH,sx(x),H);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(`−${t%1?t.toFixed(1):t} s`,x+8,topH+20)}

  const nodeAt=(x,y)=>{if(S.fx[s-1].type!=='eq')return null;const P=[...PK].map(k=>N[`fx${s}${k}`]);let best=null,bd=20;
    eqNodes(P,cv.clientWidth,cv.clientHeight).forEach(n=>{const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;best=n}});return best};
  cv.addEventListener('pointermove',e=>{const [x,y]=local(e);
    if(EQDRAG.s===s&&EQDRAG.k){const {dY}=eqGeom(0,cv.clientHeight),n=clamp(.5+clamp(dY(y),-15,15)/30,0,1);setN(`fx${s}${EQDRAG.k}`,n);
      if(EQDRAG.k==='B')setN(`fx${s}C`,clamp(Math.log(xLog(x,cv.clientWidth)/200)/Math.log(40),0,1));return}
    cv.style.cursor=nodeAt(x,y)?'grab':''});
  cv.addEventListener('pointerdown',e=>{const n=nodeAt(...local(e));if(!n)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}EQDRAG.s=s;EQDRAG.k=n.k;
    gesture(`fx${s}${n.k}`,true);if(n.k==='B')gesture(`fx${s}C`,true);cv.style.cursor='grabbing'});
  const end=()=>{if(EQDRAG.s!==s)return;gesture(`fx${s}${EQDRAG.k}`,false);if(EQDRAG.k==='B')gesture(`fx${s}C`,false);EQDRAG.s=0;EQDRAG.k='';cv.style.cursor=''};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('dblclick',e=>{const n=nodeAt(...local(e));if(n){gesture(`fx${s}${n.k}`,true);setN(`fx${s}${n.k}`,.5);gesture(`fx${s}${n.k}`,false)}});
});

/* ---------- meters, header, loop ---------- */
const mL=$('#mL'),mR=$('#mR');
function meters(){mL.style.setProperty('--l',lv[0]*100+'%');mR.style.setProperty('--l',lv[1]*100+'%')}
function hud(){const p=PRESETS[S.preset];$('#pname').innerHTML=`${String(S.preset+1).padStart(2,'0')} · ${p.name}${isEdited()?' <em>●</em>':''}`}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pending=false;
function changed(){hud();if(reduced&&!pending){pending=true;requestAnimationFrame(t=>{pending=false;draw(t);meters()})}}
function loop(t){if($('#view-main').hidden)drawFx(t);else draw(t);meters();requestAnimationFrame(loop)}
$('#play').onclick=()=>{S.playing=!S.playing;$('#playIcon').setAttribute('d',S.playing?'M2 1h3v12H2zM7 1h3v12H7z':'M2 1 L11 7 L2 13Z');$('#play').setAttribute('aria-label',S.playing?'Pause playhead':'Play')};

/* ---------- fit the 1320px-wide layout into the plugin window ---------- */
const device=$('#device');
function fit(){const w=innerWidth,h=innerHeight,dh=device.offsetHeight,s=Math.min(w/1320,h/dh);
  device.style.transform=`translate(${Math.max(0,(w-1320*s)/2)}px,${Math.max(0,(h-dh*s)/2)}px) scale(${s})`}
addEventListener('resize',fit);new ResizeObserver(fit).observe(device);fit();
document.addEventListener('contextmenu',e=>e.preventDefault());

$$('[data-k]').forEach(el=>renderKnob(el.dataset.k));
$$('[data-f]').forEach(el=>renderFader(el.dataset.f));
for(let s=1;s<=4;s++)fxUI(s);
applyPreset(2,true);
if(!reduced)requestAnimationFrame(loop);
document.fonts?.ready.then(()=>{fit();changed()});
hello();
})();
</script>
